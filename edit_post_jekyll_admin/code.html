                    },
                    "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
<!-- SideNavBar (Shared Component #2) -->
<nav class="hidden md:flex h-screen w-64 fixed left-0 top-0 flex-col p-md bg-surface-container-low dark:bg-surface-container-high border-r border-outline-variant dark:border-outline">
<div class="mb-xl">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Admin Panel</h1>
<p class="font-label-md text-label-md text-secondary mt-xs">Jekyll CMS</p>
</div>
<button class="bg-primary text-on-primary font-label-md text-label-md uppercase py-sm px-md w-full text-center mb-xl hover:bg-surface-tint transition-colors duration-200">
            New Project
        </button>
<ul class="flex flex-col gap-sm flex-1">
<li>
<a class="flex items-center gap-sm px-md py-sm text-secondary dark:text-on-secondary-fixed-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors rounded" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
</li>
<li>
<a class="flex items-center gap-sm px-md py-sm bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed font-bold translate-x-1 transition-transform rounded" href="#">
<span class="material-symbols-outlined icon-fill" data-icon="edit_document">edit_document</span>
<span class="font-label-md text-label-md">Posts</span>
</a>
</li>
<li>
<a class="flex items-center gap-sm px-md py-sm text-secondary dark:text-on-secondary-fixed-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors rounded" href="#">
<span class="material-symbols-outlined" data-icon="category">category</span>
<span class="font-label-md text-label-md">Categories</span>
</a>
</li>
<li>
<a class="flex items-center gap-sm px-md py-sm text-secondary dark:text-on-secondary-fixed-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors rounded" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</li>
</ul>
<div class="mt-auto">
<a class="flex items-center gap-sm px-md py-sm text-secondary dark:text-on-secondary-fixed-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors rounded border-t border-outline-variant pt-md" href="#">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-label-md text-label-md">Logout</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 md:ml-64 p-container-margin md:p-xl w-full max-w-5xl">
<header class="mb-lg flex justify-between items-end border-b border-outline-variant pb-md">
<div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Edit Post</h2>
<p class="font-body-md text-body-md text-secondary mt-xs">Update project details and media.</p>
</div>
<div class="flex gap-sm">
<button class="bg-transparent border-2 border-outline text-on-surface font-label-md text-label-md uppercase py-xs px-md hover:border-primary hover:text-primary transition-colors">
                    Save Draft
                </button>
<button class="bg-primary text-on-primary font-label-md text-label-md uppercase py-xs px-md hover:bg-surface-tint transition-colors">
                    Publish
                </button>
</div>
</header>
<form class="grid grid-cols-1 lg:grid-cols-3 gap-xl">
<!-- Left Column: Form Fields -->
<div class="lg:col-span-2 flex flex-col gap-lg">
<!-- Title Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="post-title">Project Title</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-none px-md py-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="post-title" type="text" value="Resin Cast Prototype V2"/>
</div>
<!-- Slug Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="post-slug">Slug</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-none px-md py-sm font-code text-code text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="post-slug" type="text" value="resin-cast-prototype-v2"/>
</div>
<!-- Client Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="post-client">Client</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-none px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="post-client" type="text" value="Industrial Arts Co."/>
</div>
<!-- Description / Rich Text -->
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="post-desc">Description (Markdown)</label>
<div class="border border-outline-variant bg-surface-container-lowest flex flex-col flex-1 min-h-[300px]">
<!-- Toolbar -->
<div class="flex gap-sm p-sm border-b border-outline-variant bg-surface-container-low">
<button class="p-xs text-secondary hover:text-primary" type="button"><span class="material-symbols-outlined">format_bold</span></button>
<button class="p-xs text-secondary hover:text-primary" type="button"><span class="material-symbols-outlined">format_italic</span></button>
<button class="p-xs text-secondary hover:text-primary" type="button"><span class="material-symbols-outlined">format_list_bulleted</span></button>
<button class="p-xs text-secondary hover:text-primary" type="button"><span class="material-symbols-outlined">link</span></button>
<button class="p-xs text-secondary hover:text-primary" type="button"><span class="material-symbols-outlined">image</span></button>
</div>
<!-- Textarea -->
<textarea class="w-full flex-1 p-md font-code text-code text-on-surface resize-none focus:outline-none focus:ring-0 border-none bg-transparent" id="post-desc">Testing a new high-clarity resin mixture for the upcoming gallery showcase. The cure time was extended by 15% to ensure absolute transparency.</textarea>
</div>
</div>
</div>
<!-- Right Column: Meta & Media -->
<div class="flex flex-col gap-lg">
<!-- Category -->
<div class="flex flex-col gap-xs bg-surface-container-low p-md border border-outline-variant">
<label class="font-label-md text-label-md text-on-surface-variant mb-xs" for="post-category">Category</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-none px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 appearance-none" id="post-category">
<option value="sculpture">Sculpture</option>
<option selected="" value="prop">Prop Fabrication</option>
<option value="concept">Concept Art</option>
</select>
</div>
<!-- Media Upload -->
<div class="flex flex-col gap-xs bg-surface-container-low p-md border border-outline-variant">
<label class="font-label-md text-label-md text-on-surface-variant mb-xs">Featured Media</label>
<!-- Preview Area -->
<div class="relative w-full aspect-[4/3] bg-surface-dim mb-sm border border-outline-variant overflow-hidden group">
<img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida/AP1WRLuGHVRge4nJ59QcilSp9nXc1BXhh_6NFEZG1ej49Zl-4BK9XNskbln1MkgAzmMqUy1HWa3b9mgv47nESi3bOkO9T038IC1FwQ-h9z3MyV77q4b-3q-iv2ab7KSwPMc3IYa9K6wS9y9VrBxY3ZNL8JGfBsohdi-NhkBzyR7IZWuVhk-H3emHCFXEJW51m48Zmi9_SHUctX1w8_qYvl8ZD52HcEyVVrB8EGk1VBNc-BdAFJckxiRnIrcsE9U"/>
<div class="absolute inset-0 bg-tertiary/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<button class="bg-surface text-on-surface px-md py-sm font-label-md text-label-md uppercase flex items-center gap-xs hover:bg-surface-bright" type="button">
<span class="material-symbols-outlined text-[18px]">swap_horiz</span> Replace
                            </button>
</div>
</div>
<!-- Upload Zone -->
<div class="border-2 border-dashed border-outline-variant p-md text-center hover:border-primary transition-colors cursor-pointer bg-surface-container-lowest">
<span class="material-symbols-outlined text-outline mb-xs text-[32px]">upload_file</span>
<p class="font-label-md text-label-md text-secondary">Drag & Drop or Click to Upload</p>
<p class="font-body-md text-body-md text-outline mt-xs text-sm">JPG, PNG, GIF up to 5MB</p>
</div>
</div>
<!-- Danger Zone -->
<div class="mt-auto pt-lg border-t border-error-container">
<button class="w-full py-sm px-md text-error font-label-md text-label-md uppercase hover:bg-error-container/20 transition-colors flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">delete</span> Delete Post
                    </button>
</div>
</div>
</form>
</main>
</body></html>
