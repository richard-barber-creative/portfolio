<div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
  <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous image">&larr;</button>
  <div class="lightbox__stage">
    <img class="lightbox__image" id="lightbox-image" src="" alt="">
    <div class="lightbox__caption">
      <span class="lightbox__project" id="lightbox-project"></span>
      <a class="lightbox__link" id="lightbox-link" href="#">View Project &rarr;</a>
    </div>
  </div>
  <button type="button" class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next image">&rarr;</button>
</div>
