<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface text-on-surface antialiased font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center p-md md:p-lg">
<main class="w-full max-w-[420px]">
<div class="bg-surface-container-lowest border border-outline-variant p-xl flex flex-col gap-xl">
<div class="flex flex-col gap-sm text-center">
<span class="material-symbols-outlined text-primary text-[32px] mx-auto mb-sm" style="font-variation-settings: 'FILL' 1;">
                    admin_panel_settings
                </span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tighter">Richard Barber Creative Admin</h1>
<p class="font-body-md text-body-md text-secondary">Jekyll CMS</p>
</div>
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline-variant px-md py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-none placeholder:text-outline" id="email" name="email" placeholder="admin@richardbarber.co.uk" required="" type="email"/>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<input class="w-full bg-surface border border-outline-variant px-md py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-none placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md uppercase py-[16px] px-lg rounded-none hover:bg-inverse-surface transition-transform duration-200 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="text-center pt-md border-t border-outline-variant">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors underline decoration-outline-variant underline-offset-4" href="#">Forgot Password?</a>
</div>
</div>
</main>
</body></html>
