---
layout: admin
title: Edit Project
permalink: /admin/projects/edit/
---
<div class="admin-shell">
  {% include admin-sidebar.html active="projects" %}
  <main class="admin-main">
    <header class="admin-header">
      <div>
        <h2 id="form-title">New Project</h2>
        <p>Fill in the details below, then save to publish.</p>
      </div>
      <a class="btn btn-ghost" href="{{ '/admin/projects/' | relative_url }}">&larr; Back to Projects</a>
    </header>

    <div id="status" class="admin-status" hidden></div>

    <div class="admin-card">
      <form id="project-form">
        <div class="field">
          <label for="title">Project Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="field">
          <label for="slug">URL Slug (auto-filled, edit only if needed)</label>
          <input type="text" id="slug" required>
        </div>
        <div class="field">
          <label for="client">Client</label>
          <input type="text" id="client" placeholder="Personal Project">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required></select>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description"></textarea>
        </div>
        <div class="field">
          <label for="main-image">Main Image Path (e.g. /assets/images/my-project.jpg)</label>
          <input type="text" id="main-image" required>
        </div>
        <div class="field">
          <label for="main-image-alt">Main Image Alt Text</label>
          <input type="text" id="main-image-alt">
        </div>

        <div class="field">
          <label>Gallery Images</label>
          <div id="gallery-repeater" class="gallery-repeater"></div>
          <button type="button" class="btn btn-ghost" id="add-gallery-row" style="width:fit-content;">+ Add Gallery Image</button>
        </div>

        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-primary">Save Project</button>
      </form>
    </div>
  </main>
</div>

<script>
  RBCAdmin.requireAuth();

  var params = new URLSearchParams(window.location.search);
  var editingSlug = params.get("slug");
  var portfolioData = null;
  var fileSha = null;
  var titleTouchedSlug = false;

  function showStatus(message, type) {
    var el = document.getElementById("status");
    el.textContent = message;
    el.hidden = false;
    el.className = "admin-status" + (type ? " is-" + type : "");
  }

  function addGalleryRow(url, alt) {
    var wrap = document.getElementById("gallery-repeater");
    var row = document.createElement("div");
    row.className = "gallery-repeater__row";
    row.innerHTML =
      '<input type="text" placeholder="Image path" class="gallery-url" value="' + (url || "").replace(/"/g, "&quot;") + '">' +
      '<input type="text" placeholder="Alt text" class="gallery-alt" value="' + (alt || "").replace(/"/g, "&quot;") + '">' +
      '<button type="button" class="btn btn-ghost" style="padding:8px 12px;">&times;</button>';
    row.querySelector("button").addEventListener("click", function () { row.remove(); });
    wrap.appendChild(row);
  }

  document.getElementById("add-gallery-row").addEventListener("click", function () {
    addGalleryRow("", "");
  });

  document.getElementById("title").addEventListener("input", function () {
    if (!editingSlug && !titleTouchedSlug) {
      document.getElementById("slug").value = RBCAdmin.slugify(this.value);
    }
  });
  document.getElementById("slug").addEventListener("input", function () { titleTouchedSlug = true; });

  async function init() {
    if (!RBCAdmin.GitHub.configured()) {
      showStatus("You're not signed in. Redirecting to Sign In…", "error");
      document.getElementById("project-form").hidden = true;
      return;
    }
    try {
      var file = await RBCAdmin.GitHub.getJsonFile(RBCAdmin.PORTFOLIO_PATH);
      portfolioData = file.data;
      fileSha = file.sha;

      var categorySelect = document.getElementById("category");
      categorySelect.innerHTML = (portfolioData.categories || []).map(function (c) {
        return '<option value="' + c.slug + '">' + c.name + "</option>";
      }).join("");

      if (editingSlug) {
        document.getElementById("form-title").textContent = "Edit Project";
        var project = (portfolioData.projects || []).find(function (p) { return p.slug === editingSlug; });
        if (!project) {
          showStatus("Project not found.", "error");
          return;
        }
        document.getElementById("title").value = project.title || "";
        document.getElementById("slug").value = project.slug || "";
        document.getElementById("client").value = project.client || "";
        document.getElementById("category").value = project.category_slug || "";
        document.getElementById("description").value = project.description || "";
        document.getElementById("main-image").value = project.main_image_url || "";
        document.getElementById("main-image-alt").value = project.main_image_alt_text || "";
        (project.gallery_images || []).forEach(function (img) {
          addGalleryRow(img.url, img.alt_text);
        });
      }
    } catch (err) {
      showStatus(err.message, "error");
    }
  }

  function categoryName(slug) {
    var match = (portfolioData.categories || []).find(function (c) { return c.slug === slug; });
    return match ? match.name : slug;
  }

  document.getElementById("project-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorEl = document.getElementById("form-error");
    errorEl.textContent = "";

    var slug = RBCAdmin.slugify(document.getElementById("slug").value);
    if (!slug) {
      errorEl.textContent = "Please provide a valid URL slug.";
      return;
    }

    var galleryRows = document.querySelectorAll("#gallery-repeater .gallery-repeater__row");
    var galleryImages = Array.from(galleryRows).map(function (row) {
      return {
        url: row.querySelector(".gallery-url").value.trim(),
        alt_text: row.querySelector(".gallery-alt").value.trim()
      };
    }).filter(function (img) { return img.url; });

    var categorySlug = document.getElementById("category").value;
    var newProject = {
      project_id: slug,
      title: document.getElementById("title").value.trim(),
      slug: slug,
      category: categoryName(categorySlug),
      category_slug: categorySlug,
      client: document.getElementById("client").value.trim() || "Personal Project",
      description: document.getElementById("description").value.trim(),
      main_image_url: document.getElementById("main-image").value.trim(),
      main_image_alt_text: document.getElementById("main-image-alt").value.trim(),
      gallery_images: galleryImages,
      source_url: ""
    };

    var projects = portfolioData.projects || [];
    var existingIndex = projects.findIndex(function (p) { return p.slug === (editingSlug || slug); });
    var duplicateIndex = projects.findIndex(function (p) { return p.slug === slug; });

    if (duplicateIndex !== -1 && duplicateIndex !== existingIndex) {
      errorEl.textContent = "Another project already uses this slug. Please choose a different one.";
      return;
    }

    if (existingIndex !== -1) {
      projects[existingIndex] = newProject;
    } else {
      projects.push(newProject);
    }
    portfolioData.projects = projects;

    try {
      await RBCAdmin.GitHub.putJsonFile(
        RBCAdmin.PORTFOLIO_PATH,
        portfolioData,
        fileSha,
        (editingSlug ? "Update" : "Add") + " project: " + newProject.title
      );
      showStatus("Saved. The live site will rebuild automatically in a minute or two.", "success");
      setTimeout(function () {
        window.location.href = "{{ '/admin/projects/' | relative_url }}";
      }, 1200);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  init();
</script>
